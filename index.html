<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penguji Pseudocode &amp; Go</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#14213d;--mute:#5b6b85;--line:#cfd9e6;--ok:#117a4d;--okbg:#dff3e8;--bad:#b3261e;--badbg:#fbe3e1;--acc:#1f4fd8;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#e6edf8;--mute:#9fb0cc;--line:#2a3a5a;--ok:#5fd6a0;--okbg:#12362b;--bad:#ff8f87;--badbg:#3d1c1f;--acc:#8fb0ff;--onacc:#0e1626}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#e6edf8;--mute:#9fb0cc;--line:#2a3a5a;--ok:#5fd6a0;--okbg:#12362b;--bad:#ff8f87;--badbg:#3d1c1f;--acc:#8fb0ff;--onacc:#0e1626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1600px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute);max-width:none}
.grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:1.05rem;margin:0 0 10px}
textarea{width:100%;height:340px;resize:vertical;font:14px/1.6 "JetBrains Mono",ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;tab-size:2}
input[type=text]{width:100%;font:14px "JetBrains Mono",monospace;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea:focus,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.editor{display:flex;height:340px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;resize:vertical}
.editor:focus-within{border-color:var(--acc)}
.gutter{flex:0 0 auto;margin:0;padding:12px 8px 12px 10px;font:14px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--mute);text-align:right;white-space:pre;overflow:hidden;user-select:none;background:var(--bg);border-right:1px solid var(--line);min-width:2.8em}
.editor textarea{flex:1 1 auto;height:100%;min-width:0;border:0;border-radius:0;padding:12px;background:transparent;resize:none;overflow:auto;white-space:pre}
.editor textarea:focus{outline:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.row.b{margin:10px 0 0}
button{font:inherit;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
select{font:inherit;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;max-width:100%}
select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td.m{font-family:"JetBrains Mono",monospace;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.82rem;white-space:nowrap}
.pass{background:var(--okbg);color:var(--ok)}.fail{background:var(--badbg);color:var(--bad)}
.summary{font-weight:700;margin:0 0 10px}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px;font-family:"JetBrains Mono",monospace;font-size:.8rem;margin-top:4px}
.small{color:var(--mute);font-size:.85rem;margin:10px 0 0}
.tbl{overflow-x:auto}
.tbl table{width:100%;table-layout:fixed}
.tbl th:nth-child(1),.tbl td:nth-child(1){width:36%}
.tbl th:nth-child(2),.tbl td:nth-child(2){width:16%}
.tbl th:nth-child(3),.tbl td:nth-child(3){width:22%}
.tbl th:nth-child(4),.tbl td:nth-child(4){width:16%;white-space:nowrap}
.tbl th:nth-child(5),.tbl td:nth-child(5){width:10%;white-space:nowrap;text-align:center}
.tbl td:nth-child(5) button{padding:4px 8px;min-width:32px}
.vars-panel{margin-top:16px;grid-column:1 / -1}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{padding:9px 16px}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.var-chip{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;font:14px/1.4 "JetBrains Mono",ui-monospace,monospace}
.var-name{padding:6px 10px;background:var(--bg);color:var(--mute);font-weight:600;border-right:1px solid var(--line)}
.var-val{padding:6px 10px;color:var(--ink);word-break:break-all}

</head>

<main><div id="root"></div></main>

<script>
const h = React.createElement;
const { useState, useMemo, useRef } = React;

const PRESETS = [
  { name: "New", code: "program contoh\nkamus\n    x : integer\nalgoritma\n    input(x)\n    output(x)\nendprogram", cases: [["7","7"]] },
];

const PSEUDO_EXAMPLES = [
  { name: "Hitung lembar uang", code:
`program HitungLembarUang
kamus
    tagihan, jumlah_lembar, sisa : integer
algoritma
    input(tagihan)

    jumlah_lembar = tagihan div 20000
    sisa = tagihan mod 20000

    if (sisa > 0) then
        jumlah_lembar = jumlah_lembar + 1
    endif

    output(jumlah_lembar, "lembar")
endprogram`,
    cases: [["10000","1 lembar"],["20000","1 lembar"],["45000","3 lembar"],["100000","5 lembar"]] },
  { name: "Switch hari", code:
`program PilihHari
kamus
    hari : integer
algoritma
    input(hari)

    switch (hari)
        case 1:
            output("Senin")
        case 2:
            output("Selasa")
        case 3:
            output("Rabu")
        otherwise:
            output("Lainnya")
    endswitch
endprogram`,
    cases: [["1","Senin"],["2","Selasa"],["3","Rabu"],["7","Lainnya"]] },
  { name: "Jumlah ganjil dengan repeat-until", code:
`program JumlahGanjil
kamus
    n, i, total : integer
algoritma
    input(n)
    i = 1
    total = 0
    repeat
        if (i mod 2 = 1) then
            total = total + i
        endif
        i = i + 1
    until (i > n)
    output(total)
endprogram`,
    cases: [["6","9"],["7","16"],["1","1"]] },
  { name: "Cek panjang nama", code:
`program CekNama
kamus
    nama : string
algoritma
    input(nama)
    if (panjang(nama) > 5) then
        output("panjang")
    else
        output("pendek")
    endif
    output(substr(nama, 0, 3))
endprogram`,
    cases: [["Budianto","panjang\nBud"],["Ali","pendek\nAli"]] },
  { name: "Faktorial iteratif", code:
`program FaktorialIteratif
kamus
    n, i, hasil : integer
algoritma
    input(n)
    hasil = 1
    for i = 1 to n do
        hasil = hasil * i
    endfor
    output(hasil)
endprogram`,
    cases: [["5","120"],["0","1"],["3","6"]] },
  { name: "Genap atau ganjil", code:
`program CekGenapGanjil
kamus
    x : integer
algoritma
    input(x)
    if (x mod 2 = 0) then
        output("genap")
    else
        output("ganjil")
    endif
endprogram`,
    cases: [["4","genap"],["5","ganjil"]] },
  { name: "Rata-rata nilai", code:
`program RataRataNilai
kamus
    n, i, nilai, jumlah : integer
algoritma
    input(n)
    jumlah = 0
    for i = 1 to n do
        input(nilai)
        jumlah = jumlah + nilai
    endfor
    output(jumlah / n)
endprogram`,
    cases: [["3 70 80 90","80"],["2 50 75","62.5"]] },
  { name: "Grade nilai", code:
`program GradeNilai
kamus
    nilai : integer
algoritma
    input(nilai)
    if (nilai >= 90) then
        output("A")
    else if (nilai >= 75) then
        output("B")
    else if (nilai >= 60) then
        output("C")
    else
        output("D")
    endif
endprogram`,
    cases: [["95","A"],["80","B"],["60","C"],["50","D"]] },
  { name: "Gabung nama", code:
`program GabungNama
kamus
    depan, belakang, nama : string
algoritma
    input(depan, belakang)
    nama = konkatenasi(depan, " ", belakang)
    output(nama)
    output(panjang(nama))
endprogram`,
    cases: [["Budi Santoso","Budi Santoso\n12"],["Ani Rahmawati","Ani Rahmawati\n13"]] },
  { name: "Hitung mundur", code:
`program HitungMundur
kamus
    n : integer
algoritma
    input(n)
    while (n > 0) do
        output(n)
        n = n - 1
    endwhile
endprogram`,
    cases: [["3","3\n2\n1"],["1","1"]] },
  { name: "Cek bilangan prima", code:
`program CekPrima
kamus
    n, i, prima : integer
algoritma
    input(n)
    prima = 1
    if (n < 2) then
        prima = 0
    else
        for i = 2 to n - 1 do
            if (n mod i = 0) then
                prima = 0
            endif
        endfor
    endif
    if (prima = 1) then
        output("prima")
    else
        output("bukan prima")
    endif
endprogram`,
    cases: [["7","prima"],["1","bukan prima"],["9","bukan prima"]] },
  { name: "Faktorial dengan fungsi", code:
`program FaktorialFungsi
kamus
    fungsi faktorial(n : integer) -> integer
        if (n <= 1) then
            return 1
        endif
        return n * faktorial(n - 1)
    endfungsi
algoritma
    input(n)
    output(faktorial(n))
endprogram`,
    cases: [["5","120"],["0","1"],["3","6"]] },
  { name: "Nilai maksimum array", code:
`program NilaiMaksimum
kamus
    A : array[1..5] of integer
    i, maks : integer
algoritma
    input(A[1], A[2], A[3], A[4], A[5])
    maks = A[1]
    for i = 2 to 5 do
        if (A[i] > maks) then
            maks = A[i]
        endif
    endfor
    output(maks)
endprogram`,
    cases: [["3 9 2 7 5","9"],["-5 -2 -9 -1 -3","-1"]] },
  { name: "Rata-rata array indeks 0", code:
`program RataRataArray
kamus
    A : array[0..2] of integer
    i, jumlah : integer
algoritma
    jumlah = 0
    for i = 0 to 2 do
        input(A[i])
        jumlah = jumlah + A[i]
    endfor
    output(jumlah / panjang(A))
endprogram`,
    cases: [["70 80 90","80"],["50 60 70","60"]] },
];

// ---------- Penerjemah pseudocode -> JavaScript ----------
const KW_END = /^(selesai|end|stop|endprogram|end\s*program|akhir\s*program)$/i;
function splitTop(s) { // pisah berdasarkan koma di level paling luar
  const out = []; let d = 0, q = "", cur = "";
  for (const ch of s) {
    if (q) { if (ch === q) q = ""; cur += ch; continue; }
    if (ch === '"' || ch === "'") { q = ch; cur += ch; continue; }
    if (ch === "(") d++; if (ch === ")") d--;
    if (ch === "," && d === 0) { out.push(cur.trim()); cur = ""; } else cur += ch;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function unwrap(s) { // buang kurung terluar: input(a, b) -> a, b
  s = s.trim();
  if (s[0] !== "(" || s[s.length - 1] !== ")") return s;
  let d = 0;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === "(") d++; if (s[i] === ")") d--;
    if (d === 0 && i < s.length - 1) return s;
  }
  return s.slice(1, -1);
}
function arrayInit(t) {
  const k = String(t || "").toLowerCase();
  if (/^(string|char|karakter)$/.test(k)) return '""';
  if (/^(bool|boolean|logika)$/.test(k)) return "false";
  return "0";
}
function arrayInfo(t) {
  const m = String(t).trim().match(/^array\s*\[(.+?)\.\.(.+?)\]\s*of\s*([A-Za-z]+)$/i);
  if (!m) return null;
  return { lo: m[1].trim(), hi: m[2].trim(), init: arrayInit(m[3]) };
}
function arrayEnsure(name, ctx) {
  const a = ctx.arrays.get(name);
  return "__ensureArr(" + name + ", " + a.lo + ", " + a.hi + ", " + a.init + ")";
}
function rewriteArrayExpr(e, ctx) {
  if (!ctx || !ctx.arrays.size) return e;
  let out = "";
  for (let i = 0; i < e.length;) {
    let matched = false;
    if (i === 0 || !/\w/.test(e[i - 1])) {
      for (const name of ctx.arrays.keys()) {
        if (e.slice(i, i + name.length) !== name) continue;
        if (!/^\s*\[/.test(e.slice(i + name.length))) continue;
        let j = i + name.length;
        while (j < e.length && /\s/.test(e[j])) j++;
        j++;
        let d = 1;
        for (; j < e.length && d; j++) {
          if (e[j] === "[") d++;
          else if (e[j] === "]") d--;
        }
        if (d) continue;
        const idx = e.slice(i + name.length + 1, j - 1);
        out += "__getarr(" + arrayEnsure(name, ctx) + ", " + rewriteArrayExpr(idx, ctx) + ")";
        i = j;
        matched = true;
        break;
      }
    }
    if (!matched) out += e[i++];
  }
  return out;
}
function expr(e, ctx) {
  const strs = [];
  e = e.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, (x) => { strs.push(x); return "\u0002" + (strs.length - 1) + "\u0003"; });
  if (ctx && ctx.arrays.size) {
    e = rewriteArrayExpr(e, ctx);
    for (const name of ctx.arrays.keys()) {
      e = e.replace(new RegExp("\\b(?:panjang|length)\\s*\\(\\s*" + name + "\\s*\\)", "gi"), "__len(" + arrayEnsure(name, ctx) + ")");
    }
  }
  const op = "(\\([^()]*\\)|[\\w.]+)";
  e = e.replace(/×/g, "*").replace(/÷/g, "/")
    .replace(new RegExp(op + "\\s+div\\s+" + op, "gi"), "Math.trunc($1/$2)")
    .replace(/\bmod\b/gi, "%").replace(/\bbenar\b/gi, "true").replace(/\bsalah\b/gi, "false")
    .replace(/\b(?:panjang|length)\s*\(/gi, "__len(")
    .replace(/\bsubstr\s*\(/gi, "__sub(")
    .replace(/\bkonkatenasi\s*\(/gi, "__cat(");
  return e.replace(/\u0002(\d+)\u0003/g, (_, n) => strs[+n]);
}
function cond(c, ctx) {
  return expr(c, ctx).replace(/≥/g, ">=").replace(/≤/g, "<=").replace(/≠|<>/g, "!=")
    .replace(/\b(dan|and)\b/gi, "&&").replace(/\b(atau|or)\b/gi, "||").replace(/\b(tidak|not)\b/gi, "!")
    .replace(/([^<>!=])=(?!=)/g, "$1==");
}
function parsePseudoParams(s) {
  const out = [];
  splitTop(s).forEach((part) => {
    if (!part) return;
    const t = part.match(/^(.+?)\s*:\s*(.+)$/);
    if (!t) { part.split(",").map((x) => x.trim()).filter(Boolean).forEach((n) => out.push({ name: n, type: "" })); return; }
    const type = t[2].trim();
    t[1].split(",").map((x) => x.trim()).filter(Boolean).forEach((n) => out.push({ name: n, type }));
  });
  return out;
}
function pseudoFunctionBlocks(code) {
  const lines = code.split("\n").map((text, i) => ({ text, no: i + 1 }));
  const main = [], funcs = [], names = new Set();
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i], s = line.text.replace(/\/\/.*$/, "").trim();
    let m = s.match(/^(?:fungsi|function)\s+([A-Za-z_]\w*)\s*\((.*)\)\s*(?:->|:)\s*(.+)$/i);
    let kind = "fungsi";
    if (!m) {
      m = s.match(/^(?:prosedur|procedure)\s+([A-Za-z_]\w*)\s*\((.*)\)\s*$/i);
      kind = "prosedur";
    }
    if (!m) { main.push(line); continue; }
    const name = m[1], params = parsePseudoParams(m[2] || ""), type = kind === "fungsi" ? m[3].trim() : "";
    if (names.has(name)) throw new Error("Baris " + line.no + ": nama fungsi/prosedur sudah ada");
    names.add(name);
    const endRe = kind === "fungsi"
      ? /^(endfungsi|end\s*fungsi|akhir\s*fungsi|selesai\s*fungsi|endfunction|end\s*function)$/i
      : /^(endprosedur|end\s*prosedur|akhir\s*prosedur|selesai\s*prosedur|endprocedure|end\s*procedure)$/i;
    const body = [];
    let closed = false;
    i++;
    for (; i < lines.length; i++) {
      const s2 = lines[i].text.replace(/\/\/.*$/, "").trim();
      if (endRe.test(s2)) { closed = true; break; }
      body.push(lines[i]);
    }
    if (!closed) throw new Error("Baris " + line.no + ": end fungsi/prosedur tidak ditemukan");
    funcs.push({ name, params, type, kind, body, no: line.no });
  }
  return { main, funcs };
}
function compilePseudoBlock(lines, opts) {
  const globals = opts.globals || new Set();
  const vars = new Set(), arrays = new Map(opts.arrays || []);
  const ctx = { js: [], vars, arrays, globals, symbols: opts.symbols || new Map(), params: opts.params || new Set() };
  let inDecl = false, inSwitch = false, sawCase = false;
  const bad = (m, line) => { throw new Error("Baris " + line.no + ": " + m + " -> " + line.text.trim()); };
  const addVar = (n) => { if (!globals.has(n)) vars.add(n); };
  const declare = (d, line) => {
    const a = d.match(/^(.+?)\s*:\s*array\s*\[(.+?)\.\.(.+?)\]\s*of\s*([A-Za-z]+)$/i);
    if (a) {
      a[1].split(",").map((x) => x.trim()).filter(Boolean).forEach((n) => {
        if (!/^[A-Za-z_]\w*$/.test(n)) bad("nama variabel tidak valid: " + n, line);
        vars.add(n);
        arrays.set(n, { lo: a[2].trim(), hi: a[3].trim(), init: arrayInit(a[4]) });
        ctx.js.push(n + " = __make(" + a[2].trim() + ", " + a[3].trim() + ", " + arrayInit(a[4]) + ");");
      });
      return;
    }
    const m = d.match(/^(?:(?:constant|const|konstanta)\s+)?(.+?)\s*:\s*[A-Za-z]+(?:\s*(?:=|<-)\s*(.+))?$/i);
    if (!m) bad("Deklarasi tidak dikenali: " + d, line);
    m[1].split(",").map((x) => x.trim()).filter(Boolean).forEach((n) => {
      if (!/^[A-Za-z_]\w*$/.test(n)) bad("nama variabel tidak valid: " + n, line);
      vars.add(n);
    });
    if (m[2]) ctx.js.push(m[1].trim() + " = " + expr(m[2], ctx) + ";");
  };
  for (const line of lines) {
    const raw = line.text, s = raw.replace(/\/\/.*$/, "").trim();
    if (!s) continue;
    let m;
    if (/^(algoritma|mulai|begin)\b/i.test(s)) { inDecl = false; continue; }
    if (/^(kamus|deklarasi|declare|var)\s*$/i.test(s)) { inDecl = true; continue; }
    if (/^program\b/i.test(s) || KW_END.test(s)) continue;
    if (/^(kamus|deklarasi|declare|var)\b/i.test(s) && s.includes(":")) { declare(s.replace(/^\w+\s+/, ""), line); continue; }
    if (inDecl) { declare(s, line); continue; }
    if ((m = s.match(/^(?:return|kembalikan)\b\s*(.*)$/i))) { ctx.js.push("return" + (m[1] ? " " + expr(m[1], ctx) : "") + ";"); continue; }
    if (/^(akhir\s*jika|selesai\s*jika|end\s*if|endif)$/i.test(s) || /^(akhir\s*selama|end\s*while|endwhile|akhir\s*untuk|end\s*for|endfor)$/i.test(s)) { ctx.js.push("}"); continue; }
    if (/^(?:repeat|ulangi)\s*$/i.test(s)) { ctx.js.push("do { if (++__g > 100000) throw new Error('Perulangan tidak berhenti');"); continue; }
    if ((m = s.match(/^(?:until|sampai)\s+(.+)$/i))) { ctx.js.push("} while (!(" + cond(unwrap(m[1]), ctx) + "));"); continue; }
    if (/^(endswitch|end\s*switch|akhir\s*(?:switch|pilih)|selesai\s*(?:switch|pilih))$/i.test(s)) {
      if (!inSwitch) bad("endswitch tanpa switch", line);
      if (sawCase) ctx.js.push("break;");
      inSwitch = false; sawCase = false;

function Editor({ value, onChange, label }) {
  const gutterRef = useRef(null);
  const count = value.split("\n").length;
  const nums = useMemo(() => Array.from({ length: count }, (_, n) => n + 1).join("\n"), [count]);
  const onScroll = (e) => { if (gutterRef.current) gutterRef.current.scrollTop = e.target.scrollTop; };
  return h("div", { className: "editor" },
    h("pre", { className: "gutter", ref: gutterRef, "aria-hidden": "true" }, nums),
    h("textarea", { value, onChange, onScroll, spellCheck: false, wrap: "off", "aria-label": label })
  );
}

function Tester({ title, presets, runner, start, hint, dropdown }) {
  const [pi, setPi] = useState(start);
  const [code, setCode] = useState(presets[start].code);
  const [cases, setCases] = useState(presets[start].cases.map(([i, e]) => ({ i, e })));

  const pick = (n) => { setPi(n); setCode(presets[n].code); setCases(presets[n].cases.map(([i, e]) => ({ i, e }))); };
  const setCase = (n, f, v) => setCases((cs) => cs.map((c, x) => (x === n ? { ...c, [f]: v } : c)));

  const results = useMemo(() => cases.map((c) => {
    let vars = {};
    try { const got = runner(code, c.i, (v) => { vars = v; }); return { got, ok: same(got, c.e), vars }; }
    catch (e) { return { got: "", ok: false, error: e.message, vars: null }; }
  }), [code, cases]);
  const passed = results.filter((r) => r.ok).length;
  const shown = results.find((r) => r.vars);
  const shownIndex = shown ? results.indexOf(shown) : -1;
  const picker = dropdown
    ? h("div", { className: "row" }, h("select", { "aria-label": "Pilih " + title, value: pi, onChange: (e) => pick(Number(e.target.value)) }, presets.map((p, n) => h("option", { key: p.name, value: n }, p.name))))
    : h("div", { className: "row" }, presets.map((p, n) => h("button", { key: p.name, className: n === pi ? "on" : "", onClick: () => pick(n) }, p.name)));

  return h("div", { className: "grid" },
    h("section", { className: "panel" },
      h("h2", null, title),
      picker,
      h(Editor, { value: code, onChange: (e) => setCode(e.target.value), label: "Editor " + title }),
    ),
    h("section", { className: "panel" },
      h("h2", null, "Pengecekan output"),
      h("p", { className: "summary", role: "status" }, passed === cases.length && cases.length ? "Semua " + cases.length + " output sesuai." : passed + " dari " + cases.length + " output sesuai."),
      h("div", { className: "tbl" }, h("table", null,
        h("thead", null, h("tr", null, ["Masukan", "Diharapkan", "Hasil", "Status", ""].map((t, n) => h("th", { key: n }, t)))),
        h("tbody", null, cases.map((c, n) => h("tr", { key: n },

function rich(text) {
  return text.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g).filter(Boolean).map((t, n) => {
    if (t.startsWith("**") && t.endsWith("**")) return h("strong", { key: n }, t.slice(2, -2));
    if (t.startsWith("*") && t.endsWith("*")) return h("em", { key: n }, t.slice(1, -1));
    return t;
  });
}
