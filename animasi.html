<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animasi Program - Code Checker</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#14213d;--mute:#5b6b85;--line:#cfd9e6;--acc:#1f4fd8;--onacc:#fff;--hi:#ffd54f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#e6edf8;--mute:#9fb0cc;--line:#2a3a5a;--acc:#8fb0ff;--onacc:#0e1626;--hi:#c9a227}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#e6edf8;--mute:#9fb0cc;--line:#2a3a5a;--acc:#8fb0ff;--onacc:#0e1626;--hi:#c9a227}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
h2{font-size:1.05rem;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
button{font:inherit;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[type=text]{font:14px "JetBrains Mono",monospace;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.code{font:13px/1.7 "JetBrains Mono",monospace;white-space:pre;overflow:auto;max-height:460px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.code div{padding:0 8px;border-radius:4px;min-height:1.7em}
.code div.active{background:var(--hi);color:#14213d;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.info{font:14px "JetBrains Mono",monospace;color:var(--mute);margin:8px 0 0}
#output{font:14px/1.6 "JetBrains Mono",monospace;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:60px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:13px "JetBrains Mono",monospace;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.small{font-size:.85rem;color:var(--mute);margin:8px 0 0}
label{font-weight:700}
</style>
</head>
<body>
<main>
<h1>Animasi Program</h1>
<p class="sub">Kode yang dianimasikan diambil dari <strong id="src-label">tab yang aktif</strong> di halaman Code Checker.</p>

<div class="panel">
  <div class="row">
    <label for="input">Masukan</label>
    <input type="text" id="input" placeholder="mis. 5 atau 3 70 80 90">
    <button id="run">↻ Jalankan</button>
    <button id="play">▶ Putar</button>
    <button id="prev">◀ Mundur</button>
    <button id="next">Maju ▶</button>
    <button id="back">Kembali</button>
  </div>
  <p class="info" id="info"></p>
  <p class="small">Ubah masukan lalu tekan <strong>Jalankan</strong>. Baris yang sedang dieksekusi akan disorot.</p>
</div>

<div class="grid">
  <div class="panel">
    <h2>Kode program</h2>
    <div class="code" id="code"></div>
  </div>
  <div>
    <div class="panel">
      <h2>Keterangan</h2>
      <div class="info" id="detail" style="margin-top:0"></div>
    </div>
    <div class="panel">
      <h2>Nilai variabel</h2>
      <div class="chips" id="vars"></div>
    </div>
    <div class="panel">
      <h2>Output</h2>
      <div id="output"></div>
    </div>
  </div>
</div>
</main>
<script src="animasi.js"></script>
</body>
</html>
